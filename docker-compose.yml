name: ${PROJECT_PREFIX:-nutritrack}

services:
  volumes-init:
    image: alpine:3.22
    container_name: ${PROJECT_PREFIX:-nutritrack}_volumes_init
    command:
      - sh
      - -c
      - chown -R 1000:1000 /data/n8n && chown -R 10001:10001 /data/uploads
    restart: "no"
    volumes:
      - ./volumes/n8n:/data/n8n
      - ./volumes/uploads:/data/uploads

  mariadb:
    image: mariadb:11.4
    container_name: ${PROJECT_PREFIX:-nutritrack}_mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: UTC
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - ./volumes/mariadb:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    container_name: ${PROJECT_PREFIX:-nutritrack}_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./volumes/redis:/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      target: development
    container_name: ${PROJECT_PREFIX:-nutritrack}_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}${API_V1_PREFIX:-/api/v1}/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./volumes/uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: ${PROJECT_PREFIX:-nutritrack}_frontend
    restart: unless-stopped
    environment:
      VITE_APP_NAME: ${APP_NAME}
      VITE_API_BASE_URL: ${API_V1_PREFIX:-/api/v1}
      VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-10000}
      VITE_API_PROXY_TARGET: http://backend:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_PREFIX:-nutritrack}_nginx
    restart: unless-stopped
    environment:
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - app-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.102.4
    container_name: ${PROJECT_PREFIX:-nutritrack}_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_URL:-http://localhost:5679}
      WEBHOOK_URL: ${N8N_URL:-http://localhost:5679}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      TZ: ${APP_TIMEZONE:-Europe/Madrid}
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "${N8N_PORT:-5679}:5678"
    volumes:
      - ./volumes/n8n:/home/node/.n8n
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: ${PROJECT_PREFIX:-nutritrack}_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 32M
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - app-network

networks:
  app-network:
    name: ${PROJECT_PREFIX:-nutritrack}_network
    driver: bridge

volumes:
  frontend-node-modules:
    name: ${PROJECT_PREFIX:-nutritrack}_frontend_node_modules
