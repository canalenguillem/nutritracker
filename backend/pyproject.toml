[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nutritrack-backend"
version = "0.1.0"
description = "NutriTrack AI API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncmy>=0.2.10,<0.3",
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "redis>=6.2,<7.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.16,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.alembic]
script_location = "alembic"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
